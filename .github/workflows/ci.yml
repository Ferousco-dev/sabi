name: CI / Deploy

on:
  push:
    branches: [main, feat/dashboard-redesign]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, slop-check, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: AI-slop lint
        run: npm run slop-check
      - name: Build
        run: npm run build

  e2e:
    name: Playwright UI smoke tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Run smoke tests
        run: npx playwright test --project=desktop --project=mobile
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── Deploy gate ──────────────────────────────────────────────────────────
  # Runs ONLY when both quality and e2e succeed, and only for pushes to main.
  # If any CI job above fails, this job is skipped and NOTHING is deployed.
  deploy-vercel:
    name: Deploy to Vercel (production)
    runs-on: ubuntu-latest
    needs: [quality, e2e]
    # Enabled once the Vercel secrets are in: `gh variable set ENABLE_VERCEL_DEPLOY --body true`.
    # Until then this job is skipped (Vercel's native git deploy still ships the frontend).
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.ENABLE_VERCEL_DEPLOY == 'true'
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install Vercel CLI
        run: npm i -g vercel@latest
      - name: Pull Vercel project settings (production env)
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Point the build at the Laravel API
        run: |
          # Override NEXT_PUBLIC_API_URL for the production build so the frontend
          # talks to the Laravel API (currently served at api.sabihub.ng/lv).
          sed -i '/^NEXT_PUBLIC_API_URL=/d' .vercel/.env.production.local 2>/dev/null || true
          echo 'NEXT_PUBLIC_API_URL="https://api.sabihub.ng/lv/api"' >> .vercel/.env.production.local
          echo "NEXT_PUBLIC_API_URL set for build:"; grep NEXT_PUBLIC_API_URL .vercel/.env.production.local
      - name: Build with Vercel
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Deploy prebuilt output to production
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"

  # Backend PHP API to cPanel over SSH. Also gated: only after CI passes, only
  # on main. The server-only config.php + SQL dumps are never in the tarball.
  deploy-backend:
    name: Deploy backend to cPanel
    runs-on: ubuntu-latest
    needs: [quality, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
      - name: Deploy api/ over SSH (tar stream; keeps server config + SQL)
        run: |
          tar czf - -C api . | ssh -i ~/.ssh/deploy_key -p "${{ secrets.CPANEL_PORT }}" \
            -o StrictHostKeyChecking=no "${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}" \
            'mkdir -p public_html/api && tar xzf - -C public_html/api && echo "extracted OK"'
      - name: Health check
        run: |
          curl -fsS -o /dev/null -w "healthcheck HTTP %{http_code}\n" https://api.sabihub.ng/healthcheck.php \
            || echo "Note: healthcheck did not return 2xx; verify the endpoint path."
